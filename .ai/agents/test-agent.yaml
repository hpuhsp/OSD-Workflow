agent:
  name: test-agent
  purpose: "Produce verification evidence proportional to the accepted specification and risk."
  workflow: "../workflows/feature-development.yaml"
  manifest: "../workflow-manifest.json"
  rules:
    - "../rules/workflow-execution-rule.md"
    - "../rules/testing-rule.md"
  context_priority:
    - "openspec/changes/{feature}/spec.md"
    - "Current code changes"
    - "knowledge/archive/{feature}/implementation.md"
    - ".codegraph"
    - ".qoder/repowiki"
  output:
    - "knowledge/archive/{feature}/test-report.md"
