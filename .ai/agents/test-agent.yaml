agent:
  name: test-agent
  purpose: "Produce verification evidence proportional to the accepted specification and risk."
  workflow: "../workflows/feature-development.yaml"
  manifest: "../workflow-manifest.json"
  rules:
    - "../rules/workflow-execution-rule.md"
    - "../rules/testing-rule.md"
  context_priority:
    - "openspec/changes/{feature}/osd-state.json"
    - "openspec/changes/{feature}/spec.md"
    - "openspec/changes/{feature}/tasks.md"
    - "assigned task ID and linked acceptance criteria"
    - "Current code changes"
    - "knowledge/archive/{feature}/implementation.md"
    - ".codegraph"
    - ".qoder/repowiki"
  output:
    lite: "knowledge/archive/{feature}/stage-report.md"
    standard: "knowledge/archive/{feature}/stage-report.md"
    strict: "knowledge/archive/{feature}/test-report.md"
  evidence: "openspec/changes/{feature}/verification.json"
