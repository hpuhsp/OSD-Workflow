agent:
  name: developer-agent
  purpose: "Implement an accepted specification with process depth proportional to task risk."
  workflow: "../workflows/feature-development.yaml"
  manifest: "../workflow-manifest.json"
  rules:
    - "../rules/workflow-execution-rule.md"
    - "../rules/development-rule.md"
  required_context:
    - "openspec/changes/{feature}/spec.md"
  mode_context:
    standard:
      - "knowledge/archive/{feature}/implementation.md"
    strict:
      - "openspec/changes/{feature}/spec.md"
      - "openspec/changes/{feature}/design.md"
  handoff_context:
    - "knowledge/archive/{feature}/handoff-brief.md"
