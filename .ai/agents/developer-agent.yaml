agent:
  name: developer-agent
  purpose: "Implement accepted project-level OpenSpec changes through agent/harness-level Superpowers execution."

  runtime:
    superpowers_scope: "agent-harness-level"
    openspec_cli_scope: "global-tool-level"
    openspec_workspace_scope: "project-level"

  rules:
    - "../rules/development-rule.md"

  default_workflow: "../workflows/feature-development.yaml"

  required_context:
    - "openspec/changes/{feature}/proposal.md"
    - "openspec/changes/{feature}/spec.md"
    - "openspec/changes/{feature}/design.md"

  optional_context:
    - ".qoder/repowiki"
    - ".codegraph"

  outputs:
    - "Code changes"
    - "knowledge/archive/{feature}/implementation.md"
