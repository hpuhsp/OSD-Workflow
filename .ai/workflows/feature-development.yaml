workflow:
  name: adaptive-sdd-development
  description: "Lightweight, adaptive SDD workflow for AI-assisted software delivery."
  machine_contract: ".ai/workflow-manifest.json"
  execution_rule: ".ai/rules/workflow-execution-rule.md"

  principles:
    - "OSD Workflow owns task classification, mode selection, stage order, and required outputs."
    - "Superpowers participates as an execution method inside the active OSD stage for every task."
    - "OpenSpec is the specification source for every task, at a depth proportional to risk."
    - "Specification precedes implementation for every task."
    - "Implementation stays within the accepted specification."
    - "Verification provides concrete evidence that the specification was met."
    - "Process depth and artifacts scale with complexity and risk."
    - "Do not create an artifact unless it improves delivery, handoff, or risk control."

  orchestration_precedence:
    controller: "OSD Workflow"
    specification_authority: "OpenSpec"
    execution_method: "Superpowers"
    rules:
      - "Load the OSD contract before selecting or invoking supporting methods."
      - "OpenSpec and Superpowers must not replace, prepend, skip, or reorder OSD stages."
      - "Superpowers brainstorming is an internal technique within the active OSD specification stage, not a separate top-level stage."
      - "Standard and strict work must create the required OpenSpec artifacts before planning or implementation."
      - "Standard and strict work must record explicit approval before planning advances to implementation."
      - "Every non-trivial acceptance criterion must map to an atomic task and verification evidence."

  delegation:
    routing:
      owner: "OSD Workflow"
      boundary: "Classify the task and select mode, strategy, stage order, and minimum evidence only."
    specification:
      owner: "OpenSpec"
      support: "Superpowers may assist analysis inside this stage."
      boundary: "Use OpenSpec's native specification lifecycle; OSD does not recreate it."
    planning:
      owner: "Superpowers"
      boundary: "Plan from the accepted OpenSpec change without redefining scope."
    implementation:
      owner: "Superpowers"
      boundary: "Apply TDD, test-first, debugging, and execution methods selected by OSD."
    verification_and_review:
      owner: "Superpowers"
      governed_by: "OSD Workflow"
      boundary: "Produce risk-proportional evidence; OSD checks only minimum outcomes."
    archive:
      owner: "OpenSpec"
      boundary: "Use OpenSpec's native archive lifecycle when archival is required."

  routing:
    default_mode: standard
    dimensions:
      - task_type
      - complexity
      - risk
      - impact_scope
      - uncertainty
      - development_strategy
    modes:
      lite:
        use_when: "Simple, localized, low-risk work with clear expected behavior."
        flow: "OSD route -> compact OpenSpec with Superpowers assistance -> implementation with Superpowers -> verification with Superpowers"
      standard:
        use_when: "Normal feature, bug fix, or existing behavior change with moderate scope."
        flow: "OSD route -> OpenSpec with Superpowers assistance -> approval -> atomic tasks -> plan -> implementation with Superpowers -> verification -> review"
      strict:
        use_when: "Complex, cross-module, ambiguous, high-risk, regulated, or release-critical work."
        flow: "OSD route -> full OpenSpec with Superpowers assistance -> spec review -> approval -> atomic tasks -> plan -> implementation with Superpowers -> verification -> review -> archive"

  task_types:
    new_feature:
      focus: "User value, scope, non-goals, acceptance criteria, compatibility."
      default_mode: standard
    bug_fix:
      focus: "Reproduction, observed versus expected behavior, root cause, regression evidence."
      default_mode: lite
    existing_change:
      focus: "Current behavior, desired delta, compatibility, affected consumers."
      default_mode: standard
    refactor:
      focus: "Invariant behavior, impact boundary, rollback, regression coverage."
      default_mode: standard
    maintenance:
      focus: "Exact change, operational impact, focused verification."
      default_mode: lite

  development_strategies:
    tdd:
      flow: "red -> green -> refactor"
      use_when: "Core business logic, algorithms, state machines, permissions, billing, public APIs, or other behavior where executable examples can drive design."
      evidence: "Record concise red, green, and refactor evidence in the delivery record."
    test_first:
      flow: "failing reproduction or characterization -> implementation -> passing regression"
      use_when: "Bug fixes, existing behavior changes, and refactors where the behavior can be captured before editing."
      evidence: "Record concise red and green evidence in the delivery record."
    verification_only:
      flow: "implementation -> focused verification"
      use_when: "Docs, configuration, pure styling, exploratory work, or changes where test-first is not practical."
      evidence: "Record why test-first is not appropriate and provide focused verification."

  escalation:
    - "Escalate lite to standard when scope crosses modules, acceptance is unclear, or regression impact is material."
    - "Escalate standard to strict for high risk, broad architecture impact, data migration, security, compliance, or release-critical work."
    - "A user may request a lighter or stricter mode; record the decision and residual risk in the delivery record."
    - "Escalate verification_only to test_first or tdd when the task changes executable business behavior and a stable test boundary exists."

  conditional_stages:
    intake:
      when: "The request lacks enough context to classify or specify the task."
      before: specification
      rule: "Skip intake when the request and repository context are already sufficient."

  runtime_contract:
    osd_workflow:
      scope: "project-controller-level"
      required: true
      role: "Top-level controller for routing, stage order, and required outputs."
    superpowers:
      scope: "agent-harness-level"
      required: true
      role: "Required execution discipline inside OSD-controlled stages; it does not own or reorder the workflow."
    openspec_cli:
      scope: "global-tool-level"
      required: true
      role: "Required specification toolchain; artifact depth varies by mode."
    project_assets:
      scope: "project-level"
      required: true
      paths:
        - ".ai/"
        - "knowledge/archive/{feature}/"
        - "openspec/changes/{feature}/"

  stage_catalog:
    - id: intake
      purpose: "Normalize task context only when the original request is not already clear."
    - id: specification
      purpose: "Use OpenSpec to define expected behavior and acceptance criteria at the minimum useful depth."
    - id: spec-review
      purpose: "Review specification ambiguity, completeness, compatibility, and risk before planning strict work."
    - id: planning
      purpose: "Plan affected areas and verification when the change is not trivial."
    - id: implementation
      purpose: "Implement only the accepted specification using the selected TDD, test-first, or verification-only strategy."
    - id: verification
      purpose: "Run focused checks and record concrete results."
    - id: review
      purpose: "Review correctness, regressions, and residual risk at a depth proportional to risk."
    - id: approval
      purpose: "Record the human decision that the accepted specification may enter planning and implementation."
    - id: archive
      purpose: "Preserve reusable context for strict work or cross-agent handoff."

  handoff:
    rule: "Create handoff-brief.md only when another agent will continue the task."
    template: ".ai/templates/handoff-brief.md"
